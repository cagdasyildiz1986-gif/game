name: Demo'yu GitHub Pages'e yayınla

on:
  push:
    branches:
      - main
      - claude/slot-game-mobile-app-4g3xb6
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pages'i yapılandır (gerekirse etkinleştirir)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Demo derlemesini oluştur
        run: node tools/build-demo.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
