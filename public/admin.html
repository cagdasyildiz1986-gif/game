<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yönetim · Star Game</title>
<meta name="theme-color" content="#06060c">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/site.css">
<style>
  .admin-tabs { display:flex; gap:8px; overflow-x:auto; margin:18px 0; scrollbar-width:none; }
  .admin-tabs::-webkit-scrollbar { display:none; }
  .admin-tabs button {
    flex:0 0 auto; height:38px; padding:0 18px; border-radius:99px;
    border:1px solid var(--line); background:var(--surface);
    color:var(--text-2); font-size:13.5px; font-weight:600; cursor:pointer;
    box-shadow:var(--sh-sm);
  }
  .admin-tabs button.on { background:var(--brand); border-color:var(--brand); color:#fff; }

  .kpi { display:grid; grid-template-columns:repeat(2,1fr); gap:11px; margin-bottom:22px; }
  @media (min-width:700px){ .kpi { grid-template-columns:repeat(4,1fr); } }
  .kpi-card { padding:13px; border-radius:var(--radius-sm); background:var(--surface); border:1px solid var(--line); }
  .kpi-label { font-size:10px; letter-spacing:.8px; color:var(--dim); text-transform:uppercase; }
  .kpi-value { font-size:22px; font-weight:800; color:var(--text); margin-top:4px; font-variant-numeric:tabular-nums; letter-spacing:-.4px; }
  .kpi-sub { font-size:10.5px; color:var(--muted); margin-top:2px; }

  .urow {
    display:flex; align-items:center; gap:12px; padding:13px;
    border-radius:var(--r); border:1px solid var(--line);
    background:var(--surface); margin-bottom:9px; box-shadow:var(--sh-sm);
    cursor:pointer; transition:border-color .15s, transform .12s;
  }
  .urow:hover { border-color:var(--line-strong); transform:translateY(-1px); }
  .uavatar { width:40px;height:40px;flex:0 0 40px;border-radius:var(--r-sm);display:grid;place-items:center;
    background:var(--surface-3); font-size:19px; }
  .uname { font-size:13.5px; font-weight:700; }
  .umeta { font-size:10.5px; color:var(--dim); margin-top:1px; }
  .ubal { margin-left:auto; text-align:right; }
  .ubal b { display:block; font-size:15px; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums; }
  .utag { font-size:8.5px; font-weight:800; padding:2px 6px; border-radius:99px; margin-left:5px; }
  .tag-admin { background:var(--gold-soft); color:var(--gold); }
  .tag-banned { background:var(--danger-soft); color:var(--danger); }
  .tag-guest { background:var(--surface-3); color:var(--muted); }

  .setting { padding:16px; border-radius:var(--r); border:1px solid var(--line);
    background:var(--surface); margin-bottom:11px; box-shadow:var(--sh-sm); }
  .setting-head { display:flex; align-items:baseline; gap:8px; margin-bottom:8px; }
  .setting-name { font-size:13.5px; font-weight:700; }
  .setting-value { margin-left:auto; font-size:16px; font-weight:800; color:var(--text); font-variant-numeric:tabular-nums; }
  .setting-desc { font-size:12px; color:var(--text-2); line-height:1.6; margin-top:9px; }
  .setting input[type=range] { width:100%; accent-color:var(--gold); }
  .seg { display:flex; gap:6px; }
  .seg button { flex:1; height:38px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text-2); font-size:13px; font-weight:600; cursor:pointer; }
  .seg button.on { background:var(--brand); border-color:var(--brand); color:#fff; }

  .ledger-row { display:flex; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
  .ledger-row b { font-weight:700; font-variant-numeric:tabular-nums; }
  .ledger-plus { color:var(--success); }
  .ledger-minus { color:var(--danger); }
</style>
<script>
  // Tema, CSS yüklenmeden önce uygulanır (yanıp sönmeyi önler)
  try { document.documentElement.dataset.theme = localStorage.getItem('aurum-theme') || 'light'; } catch (e) {}
</script>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="icon-btn" href="./#/" aria-label="Siteye dön">‹</a>
    <div>
      <div style="font-size:15px;font-weight:900">Yönetim Paneli</div>
      <div style="font-size:10px;color:var(--dim)" id="admin-who">—</div>
    </div>
    <span class="topbar-spacer"></span>
    <div id="admin-balance" style="font-size:13px;color:var(--text);background:var(--surface-2);
      border:1px solid var(--line);padding:8px 14px;border-radius:99px;font-weight:700">—</div>
  </div>
</header>

<main class="wrap" id="admin-view" style="padding-bottom:40px"></main>

<div id="sheet-host"></div>
<div id="toast-host"></div>

<script src="js/env.js"></script>
<script type="module" src="js/admin.js"></script>
</body>
</html>
